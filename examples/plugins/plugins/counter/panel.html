<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="panel.css" />
		<script type="module" src="panel.js"></script>
	</head>
	<body>
		<main>
			<div class="counter-card">
				<output id="count">0</output>
			</div>

			<div class="control-section">
				<div class="header-group">
					<h3 id="panel-title" class="tracker-title"></h3>
					<span id="hint" class="hint-text island-faint"></span>
				</div>

				<div class="actions">
					<button id="add" class="island-button step-primary" data-tone="accent"></button>
					<button id="add5" class="island-button step-btn"></button>
					<button id="sub1" class="island-button step-btn"></button>
					<button id="reset" class="island-button reset-btn"></button>
				</div>
			</div>
		</main>
	</body>
</html>
