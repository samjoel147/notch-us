name: Preview Build & Test

# Verifies frontend + backend, then compiles the Windows .exe installer
# and portable zip on push to main or on demand via workflow_dispatch.
# Artifacts are published directly to the GitHub Actions run for instant testing.
on:
  push:
    branches: ["main"]
    paths-ignore:
      - "website/**"
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump version before building"
        type: choice
        options:
          - "none"
          - "patch"
          - "minor"
        default: "none"
      publish_prerelease:
        description: "Create a GitHub Pre-release (in addition to workflow artifact)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: preview-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      # Installs the toolchain pinned in src-tauri/rust-toolchain.toml
      - name: Install Rust
        working-directory: src-tauri
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          workspaces: src-tauri -> target
          save-if: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Verification Stage: Frontend lint & type-check
      - name: Lint frontend
        run: bunx biome ci --error-on-warnings .

      - name: Build frontend
        run: bun run build

      # Verification Stage: Backend lint
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      # Optional Version Bump
      - name: Bump version
        id: version_bump
        if: ${{ inputs.bump != null && inputs.bump != 'none' }}
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bun pm version ${{ inputs.bump }} --no-git-tag-version
          bun scripts/sync-cargo-version.ts
          $newVer = (Get-Content package.json | ConvertFrom-Json).version
          git commit -am "🔖 bump version to v$newVer [skip ci]"
          git push
          echo "bumped=true" >> $env:GITHUB_OUTPUT

      - name: Extract App Version
        id: meta
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          $runNum = "${{ github.run_number }}"
          $buildTag = "v${ver}-build.${runNum}"
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "build_tag=$buildTag" >> $env:GITHUB_OUTPUT

      # Build Windows Application (Unsigned preview build using tauri.nosign.conf.json)
      - name: Build Windows App
        run: bun run app:build:local
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      # Prepare Portable Zip
      - name: Prepare Portable Zip
        shell: pwsh
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          $runNum = "${{ github.run_number }}"
          $dir = "portable/Dynamic Island"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item src-tauri/target/release/dynamic-island.exe $dir
          New-Item -ItemType File "$dir/.portable" | Out-Null
          $zip = "Dynamic.Island_${ver}_build.${runNum}_x64-portable.zip"
          Compress-Archive -Path $dir -DestinationPath $zip
          echo "zip_path=$zip" >> $env:GITHUB_OUTPUT

      # Upload Artifacts (Downloadable directly from the GitHub Actions run summary)
      - name: Upload Test Installers & Binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-preview-${{ steps.meta.outputs.build_tag }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/dynamic-island.exe
            Dynamic.Island_*_x64-portable.zip
          retention-days: 30

      # Optional Pre-release creation
      - name: Publish Pre-release
        if: ${{ inputs.publish_prerelease == true }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.meta.outputs.build_tag }}"
          $exe = Get-Item src-tauri/target/release/bundle/nsis/*.exe
          $zip = Get-Item Dynamic.Island_*_x64-portable.zip
          gh release create $tag $exe.FullName $zip.FullName `
            --title "Dynamic Island Preview $tag" `
            --notes "Automated preview test build from GitHub Actions run #${{ github.run_number }}." `
            --prerelease

